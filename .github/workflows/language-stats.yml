name: Generate Language Stats

on:
  # Refresh daily
  schedule:
    - cron: "0 4 * * *"

  # Allows to manually run the job at any time
  workflow_dispatch:

  # Run on every push on the main branch
  push:
    branches:
      - main

jobs:
  languages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates a most-used-languages card without any external server —
      # replaces the dead github-readme-stats Vercel deployments.
      - name: generate language-stats.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: FethiOmur
          filename: language-stats.svg
          committer_branch: output
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          config_timezone: Europe/Rome
