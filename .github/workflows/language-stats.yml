name: Generate Language Stats

on:
  # Refresh daily
  schedule:
    - cron: "0 4 * * *"

  # Allows to manually run the job at any time
  workflow_dispatch:

  # Run on every push on the main branch
  push:
    branches:
      - main

jobs:
  languages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Aggregates language bytes across public repos via the REST API and
      # renders a dark-themed card — no external stats server involved.
      - name: generate language-stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_language_stats.py

      # Dedicated branch so the snake workflow's force-push to `output`
      # can never wipe this card.
      - name: push language-stats.svg to the language-stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan language-stats
          git add language-stats.svg
          git commit -m "Update language-stats.svg"
          git push --force origin language-stats
